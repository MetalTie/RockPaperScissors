<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <!-- TODO: Add a way to ask user to continue playing -->
    <!-- TODO: Add a way to display the number of turns left -->

    <!-- This is the header of the page -->
    <header>
        <h1 class="title">Rock Paper Scissors</h1>
    </header>
    

    <!-- This section prompts the user to pick rock, paper or scissors, and displays the human choice, computer choice, and result -->
    <section class="playarea">
        <div class="humanchoice">
            <h3 class="subheader">Pick a choice:</h3>
            <div>
                <button id="rock">rock</button>
                <button id="paper">paper</button>
                <button id="scissors">scissors</button>
            </div>
        </div>
        <div class="playground">
            <h2 class="item" id="human-choice">???</h2>
            <h2 class="item">VS</h2>
            <h2 class="item" id="computer-choice">???</h2>
        </div>
        <p id="result">???</p>
    </section>

    <!-- This section displays the score of the game -->
    <section class="scoreboard">
        <p id="iteration"></p>
        <h3 class="subheader">Score</h3>
        <p id="score"></p>
    </section>
</body>
<script src="javascript.js"></script>
</html>
